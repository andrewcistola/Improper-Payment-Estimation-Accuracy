# Application 2: Part C IPM - risk-score errors on capitated payments,
# national scaled population (1 synthetic enrollee = 100 real enrollees).
program: partc
seed: 20261016
output_root: output
steps:
  - sql: partc/01_contracts.sql
  - sql: partc/02_enrollees_hccs.sql
  - sql: partc/03_payments_errors.sql
  - sql: partc/04_population_truth.sql
exports:
  - {table: population, order_by: unit_id}
  - {table: hccs, file: hcc_detail, order_by: "enrollee_id, fam"}
  - {table: contracts, order_by: contract_id}
defaults:
  n_contracts: 550
  total_enrollees: 330000      # ~33M MA enrollees subject to risk adjustment, scaled 1:100
  w_pop: 100.0
  payment_target: 388720000000.0   # FY 2025 Part C payments subject to risk adjustment ($388.72B)
  # Targets as shares of payments (FY 2025 Part C IPM results). Public
  # total overpayment is 5.51% (21.43B); we read it as 5.29% unsupported
  # diagnoses + 0.22% missing documentation. Underpayments 0.57% (2.23B).
  target_unsup: 0.0529
  target_md: 0.0022
  target_under: 0.0057
  p_md: 0.003     # base probability before calibration multiplier
  p_add: 0.03
scenarios:
  - name: base
design:
  unit: enrollee
  frame: all enrollees subject to risk adjustment
  selection: stratified_srs_without_replacement
  strata:   # sample sizes are NOT public; illustrative equal allocation
    - {stratum: low, n: 1500}
    - {stratum: medium, n: 1500}
    - {stratum: high, n: 1500}
  estimator: ratio_gross_rate   # sum w*|y| / sum w*x
  weights: N_h / n_h
  interval: two_sided_95
