# Application 1: claim-level errors flowing through a benefit design to
# reinsurance and subsidy payments (Part D-like), post-IRA benefit.
# Scaled population: 1 synthetic beneficiary = 500 real beneficiaries.
program: partd
seed: 20261016
output_root: output
steps:
  - sql: partd/01_beneficiaries_pdes.sql
  - sql: partd/02_init_calibration.sql   # pass 0: no errors
  - sql: partd/03_apply_errors.sql
  - sql: partd/04_benefit.sql
  - sql: partd/05_calibrate.sql          # -> pass 1 (linear expectation)
  - sql: partd/03_apply_errors.sql
  - sql: partd/04_benefit.sql
  - sql: partd/05_calibrate.sql          # -> pass 2 (one proportional refinement)
  - sql: partd/03_apply_errors.sql
  - sql: partd/04_benefit.sql            # final run at pass-2 multipliers
  - sql: partd/06_population_truth.sql
exports:
  - {table: population, order_by: unit_id}
  - {table: pde_detail, order_by: pde_id}
defaults:
  n_benes: 108000          # ~54M Part D enrollees, scaled 1:500
  w_pop: 500.0
  lis_share: 0.25
  specialty_share: 0.03
  payment_target: 105560000000.0   # FY 2025 Part D payments ($105.56B)
  target_over: 3700000000.0        # FY 2025 overpayments ($3.70B); gross = over + under is the calibration target
  target_under: 520000000.0        # FY 2025 underpayments ($0.52B)
  # CY 2025 standard benefit after the Inflation Reduction Act
  deductible: 590.0
  oop_threshold: 2000.0
  init_enrollee_coins: 0.25
  init_mfr_brand: 0.10
  cat_mfr_brand: 0.20
  cat_reins_brand: 0.20
  cat_reins_generic: 0.40
  lis_copay_generic: 4.90
  lis_copay_brand: 12.15
scenarios:
  - name: base
design:
  unit: beneficiary (cluster of PDEs)
  frame: all Part D beneficiaries with PDEs
  selection: srs_without_replacement   # random beneficiary selection since FY 2025
  strata: [{stratum: all, n: 1500}]    # sample size NOT public; illustrative
  estimator: ratio_gross_rate          # sum |y| / sum x, y from re-running the benefit on corrected PDEs
  interval: two_sided_95_simulation
