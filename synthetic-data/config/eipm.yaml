# Application 4: Marketplace APTC eligibility errors (EIPM-like, FFE).
# Scaled: 1 synthetic application = 100 real applications.
program: eipm
seed: 20261016
output_root: output
steps:
  - sql: eipm/01_population.sql
exports:
  - {table: population, order_by: unit_id}
defaults:
  n_households: 150000
  w_pop: 100.0
  target_rate: 0.0089          # FY 2025 EIPM gross rate (0.89%, $657.46M)
  # candidate error type shares (illustrative; public reports give no split)
  share_income: 0.50
  share_elig: 0.30             # remainder (0.20) = missing documentation
  fpl_base: 15060.0            # 2024 HHS poverty guideline (used for PY 2025)
  fpl_per_person: 5380.0
  benchmark_base: 330.0        # monthly SLCSP at age 21 (illustrative)
  applicable_schedule:         # enhanced ARPA/IRA schedule, PY 2021-2025
    - {lo: 100, hi: 150, p_lo: 0.00, p_hi: 0.00}
    - {lo: 150, hi: 200, p_lo: 0.00, p_hi: 0.02}
    - {lo: 200, hi: 250, p_lo: 0.02, p_hi: 0.04}
    - {lo: 250, hi: 300, p_lo: 0.04, p_hi: 0.06}
    - {lo: 300, hi: 400, p_lo: 0.06, p_hi: 0.085}
    - {lo: 400, hi: 601, p_lo: 0.085, p_hi: 0.085}
scenarios:
  - name: base
design:
  unit: FFE application (household receiving APTC)
  strata:   # EIPM strata are NOT public; illustrative income-band strata
    - {stratum: A_lt150, n: 500}
    - {stratum: B_150_250, n: 500}
    - {stratum: C_250_400, n: 500}
    - {stratum: D_ge400, n: 500}
  selection: stratified_srs_without_replacement   # ~2,000 total
  estimator: ratio_gross_rate   # sum w*|y| / sum w*x
  interval: two_sided_95
