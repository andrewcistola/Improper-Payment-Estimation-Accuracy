# Application 2b: contract-level RADV (PY 2021 method), full-size
# contracts (no scaling). 24 explicit contracts = 6 sizes x 4 coding
# intensities, so every frame-size class meets every error regime and a
# reviewer can read each contract's setup here.
program: radv
seed: 20261016
output_root: output
steps:
  - sql: capitation/01_contracts.sql
  - sql: capitation/02_enrollees_hccs.sql
  - sql: capitation/03_payments_errors.sql
  - python: ipsim.ml:radv_frame_scores     # the one ML step: prior-year model -> pred_score
  - sql: radv/05_frame_truth.sql
exports:
  - {table: population, order_by: unit_id}
  - {table: frames, order_by: contract_id}
  - {table: hccs, file: hcc_detail, order_by: "enrollee_id, fam"}
  - {table: contracts, order_by: contract_id}
defaults:
  contract_mode: list
  n_contracts: 0
  total_enrollees: 0
  w_pop: 1.0
  payment_target: 0.0
  calibrate: false
  # Error process copied from the Part C base calibration
  # (output/partc/base/truth.json -> by.calibration.multipliers).
  p_md: 0.003
  p_add: 0.03
  m_unsup_fixed: 1.1759
  m_md_fixed: 1.5835
  m_add_fixed: 0.9077
  target_unsup: 0.0
  target_md: 0.0
  target_under: 0.0
  contracts:
    - {contract_id: 1, enrollment: 250, intensity: 0.0}   # clean: no unsupported HCCs; missing-doc and offsets only, true mean dR ~ 0
    - {contract_id: 2, enrollment: 250, intensity: 0.1}   # near zero
    - {contract_id: 3, enrollment: 250, intensity: 1.0}   # national average
    - {contract_id: 4, enrollment: 250, intensity: 2.5}   # high coding intensity
    - {contract_id: 5, enrollment: 1000, intensity: 0.0}   # clean: no unsupported HCCs; missing-doc and offsets only, true mean dR ~ 0
    - {contract_id: 6, enrollment: 1000, intensity: 0.1}   # near zero
    - {contract_id: 7, enrollment: 1000, intensity: 1.0}   # national average
    - {contract_id: 8, enrollment: 1000, intensity: 2.5}   # high coding intensity
    - {contract_id: 9, enrollment: 5000, intensity: 0.0}   # clean: no unsupported HCCs; missing-doc and offsets only, true mean dR ~ 0
    - {contract_id: 10, enrollment: 5000, intensity: 0.1}   # near zero
    - {contract_id: 11, enrollment: 5000, intensity: 1.0}   # national average
    - {contract_id: 12, enrollment: 5000, intensity: 2.5}   # high coding intensity
    - {contract_id: 13, enrollment: 20000, intensity: 0.0}   # clean: no unsupported HCCs; missing-doc and offsets only, true mean dR ~ 0
    - {contract_id: 14, enrollment: 20000, intensity: 0.1}   # near zero
    - {contract_id: 15, enrollment: 20000, intensity: 1.0}   # national average
    - {contract_id: 16, enrollment: 20000, intensity: 2.5}   # high coding intensity
    - {contract_id: 17, enrollment: 60000, intensity: 0.0}   # clean: no unsupported HCCs; missing-doc and offsets only, true mean dR ~ 0
    - {contract_id: 18, enrollment: 60000, intensity: 0.1}   # near zero
    - {contract_id: 19, enrollment: 60000, intensity: 1.0}   # national average
    - {contract_id: 20, enrollment: 60000, intensity: 2.5}   # high coding intensity
    - {contract_id: 21, enrollment: 150000, intensity: 0.0}   # clean: no unsupported HCCs; missing-doc and offsets only, true mean dR ~ 0
    - {contract_id: 22, enrollment: 150000, intensity: 0.1}   # near zero
    - {contract_id: 23, enrollment: 150000, intensity: 1.0}   # national average
    - {contract_id: 24, enrollment: 150000, intensity: 2.5}   # high coding intensity
scenarios:
  - name: base
design:
  unit: enrollee (cluster of enrollee-months)
  frame: in_frame = top quartile of eligible enrollees by pred_score, within contract
  strata: one per contract (stratum = contract_id); see frames.parquet for frame_n and sample_n
  selection: srs_without_replacement within each contract frame
  sample_size_rule: 200 for 10 largest frames; else 100/50/35 by thirds of frame size
  estimator: radv_month_weighted   # (sum dR*m / sum m) * sum(county_rate*m) over frame
  gate: one_sided_lower_90_t_n_minus_1_with_fpc > 0
  auxiliaries_for_greg: [risk_orig, pred_score, months, county_rate]   # known for every frame unit
