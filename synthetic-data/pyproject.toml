[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ipsim"
version = "0.1.0"
description = "Synthetic finite populations for validating CMS improper payment estimates"
requires-python = ">=3.10"
dependencies = ["duckdb==1.5.6", "pyarrow>=17", "numpy>=2.0", "pyyaml>=6.0"]

[project.scripts]
ipsim = "ipsim.engine:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ipsim = []
