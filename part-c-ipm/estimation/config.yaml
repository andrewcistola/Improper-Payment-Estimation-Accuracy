# Part C IPM - estimation: draw production-design samples from the
# errors/ population and estimate overpayments, underpayments, gross and net
# improper payments with each method (expansion, ratio, regression, and the
# audit-finding bootstrap simulation).
program: partc_estimation   # also the seed label for sampling and simulation
seed: 20261016
output_dir: results
steps:
  - sql: part-c-ipm/estimation/sql/01_frame.sql        # estimand + design
  - sql: shared/sql/sample_srs.sql                          # audit years (Monte Carlo replicates)
  - sql: part-c-ipm/estimation/sql/10_expansion.sql
  - sql: part-c-ipm/estimation/sql/20_ratio.sql
  - sql: part-c-ipm/estimation/sql/30_regression.sql   # regression inputs: predictors for every population unit
  - {python: shared/ipsim/regression.py, run: run}   # regression: fit within strata, predict, residual interval
  - sql: part-c-ipm/estimation/sql/40_simulation_inputs.sql   # audit findings + population rows
  - python: part-c-ipm/estimation/simulation.py # bootstrap simulation: HCC rates, payments rerun 1,000x (numpy)
  - sql: part-c-ipm/estimation/sql/90_score.sql
exports:
  - {table: estimates, order_by: "domain, method, interval, rep"}
json:
  - {table: metrics, order_by: "domain, method, interval", file: metrics.json}
  - {table: frame_totals, order_by: domain, file: truth.json}
defaults:
  population_dir: part-c-ipm/errors/output/base
  allocation:      # audit of 990 enrollees, equal across risk-score terciles
    - {stratum: low, n_h: 330}
    - {stratum: medium, n_h: 330}
    - {stratum: high, n_h: 330}
  reps: 25         # audit years (Monte Carlo replicates)
  sim_reps: 25     # audit years run through the bootstrap simulation (all of them)
  sim_iterations: 1000  # simulation iterations per audit year
  sim_rates: parametric # parametric (reported): rates redrawn as Binomial(n, rate)/n each iteration | fixed (comparison; results_fixed/)
  reg_predictors: [x, demo_score, months, n_hcc]   # regression: basic beneficiary variables + amount paid
  reg_min_errors: 10   # regression: intercept-only in a model stratum with fewer audited errors
  alpha: 0.05      # two-sided 95% intervals (PIIA reporting)
scenarios:
  - name: base
