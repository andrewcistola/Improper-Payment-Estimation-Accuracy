# Part D IPM - estimation: draw production-design samples from the
# errors/ population and estimate the gross improper payment rate with
# each method (expansion, ratio, regression, and the audit-finding simulation).
program: partd_estimation   # also the seed label for sampling and simulation
seed: 20261016
output_dir: results
steps:
  - sql: part-d-ipm/estimation/sql/01_frame.sql        # estimand + design
  - sql: shared/sql/sample_srs.sql                          # Monte Carlo samples
  - sql: part-d-ipm/estimation/sql/10_expansion.sql
  - sql: part-d-ipm/estimation/sql/20_ratio.sql
  - sql: part-d-ipm/estimation/sql/30_regression.sql
  - sql: part-d-ipm/estimation/sql/40_simulation_inputs.sql   # audit findings + population rows
  - python: part-d-ipm/estimation/simulation.py # simulation: payment function rerun 1,000x (numpy)
  - sql: part-d-ipm/estimation/sql/90_score.sql
exports:
  - {table: estimates, order_by: "domain, method, interval, rep"}
json:
  - {table: metrics, order_by: "domain, method, interval", file: metrics.json}
  - {table: frame_totals, order_by: domain, file: truth.json}
defaults:
  population_dir: part-d-ipm/errors/output/base
  allocation:      # Part D IPM sample size is not public; illustrative
    - {stratum: all, n_h: 1500}
  reps: 200        # Monte Carlo samples (MC SE of 95% coverage ~ 1.5 pt)
  sim_reps: 25       # audited samples scored for the simulation method (first 25 of reps)
  sim_iterations: 1000  # simulation iterations per audited sample
  sim_claims: 5000   # claim-level audit for the simulation: PDEs sampled independent of beneficiary
  sim_bene_draws: 108000   # beneficiaries drawn with replacement per iteration (all 108,000; stands in for production's 1M)
  alpha: 0.05      # two-sided 95% intervals (PIIA reporting)
scenarios:
  - name: base
