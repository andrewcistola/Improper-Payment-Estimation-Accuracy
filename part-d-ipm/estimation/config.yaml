# Part D IPM - estimation: draw production-design audits from the errors/
# population and estimate overpayments, underpayments, gross and net
# improper payments with each method (expansion [plug-in benefit rerun],
# ratio, regression, the design-based PDE-level estimators pde_expansion and
# pde_ratio, and the audit-finding bootstrap simulation).
program: partd_estimation   # also the seed label for sampling and simulation
seed: 20261016
output_dir: results
steps:
  - sql: part-d-ipm/estimation/sql/01_frame.sql        # estimands + beneficiary audit design
  - sql: shared/sql/sample_srs.sql                          # audit years: beneficiary audit (990)
  - sql: part-d-ipm/estimation/sql/20_ratio.sql
  - sql: part-d-ipm/estimation/sql/30_regression.sql   # regression inputs: predictors for every population unit
  - {python: shared/ipsim/regression.py, run: run}   # regression: fit within strata, predict, residual interval
  - sql: part-d-ipm/estimation/sql/40_simulation_inputs.sql   # claim strata, Neyman PDE audit (5,000)
  - {python: part-d-ipm/estimation/simulation.py, run: run_expansion}   # expansion (plug-in benefit rerun): uniform stratum haircut, delta-method interval
  - {python: part-d-ipm/estimation/simulation.py, run: run_pde_estimators}   # pde_expansion, pde_ratio: marginal effect per audited PDE, HT and ratio over PDE strata (shared macros)
  - python: part-d-ipm/estimation/simulation.py # bootstrap simulation: benefit rerun 1,000x (numpy)
  - sql: part-d-ipm/estimation/sql/90_score.sql
exports:
  - {table: estimates, order_by: "domain, method, interval, rep"}
json:
  - {table: metrics, order_by: "domain, method, interval", file: metrics.json}
  - {table: frame_totals, order_by: domain, file: truth.json}
defaults:
  population_dir: part-d-ipm/errors/output/base
  allocation:      # beneficiary audit for ratio and regression: SRS of 990
    - {stratum: all, n_h: 990}
  reps: 25         # audit years (Monte Carlo replicates)
  sim_reps: 25     # audit years run through the PDE audit methods (all of them)
  sim_iterations: 1000  # simulation iterations per audit year
  sim_audit_size: 5000  # PDE audit per audit year: claim strata, Neyman allocation
  sim_rates: parametric # parametric (reported): counts redrawn each iteration, f~ = Binomial(n, f/n), g~ = Binomial(f~, g/f); p = f~/n, q = g~/f~ | fixed (comparison; results_fixed/)
  reg_predictors: [x, gdc_sub, n_pde, catastrophic]   # regression: basic beneficiary variables + amount paid
  reg_min_errors: 10   # regression: intercept-only in a model stratum with fewer audited errors
  alpha: 0.05      # two-sided 95% intervals (PIIA reporting)
scenarios:
  - name: base
