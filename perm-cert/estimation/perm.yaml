# PERM - estimation: draw state samples (systematic selection within
# strata) from the errors/ population and estimate each state's improper
# payment rates with each method (expansion, ratio, regression, and the audit-finding simulation).
program: perm_estimation   # also the seed label for sampling and simulation
seed: 20261016
output_dir: results/perm
steps:
  - sql: perm-cert/estimation/sql/perm_01_frame.sql        # estimand + design
  - sql: shared/sql/sample_systematic.sql                   # audit years (Monte Carlo replicates)
  - sql: perm-cert/estimation/sql/perm_10_expansion.sql
  - sql: perm-cert/estimation/sql/perm_20_ratio.sql
  - sql: perm-cert/estimation/sql/perm_30_regression.sql
  - sql: perm-cert/estimation/sql/perm_40_simulation_inputs.sql   # audit findings + population rows
  - python: perm-cert/estimation/perm_simulation.py # simulation: payment function rerun 1,000x (numpy)
  - sql: perm-cert/estimation/sql/perm_90_score.sql
exports:
  - {table: estimates, order_by: "domain, method, interval, rep"}
json:
  - {table: metrics, order_by: "domain, method, interval", file: metrics.json}
  - {table: frame_totals, order_by: domain, file: truth.json}
defaults:
  population_dir: perm-cert/errors/output/perm/state_elig_grid
  components: [overall, eligibility, claims]
  n_ffs_per_stratum: 20   # 400 FFS per state-year = 4 quarters x 5 strata x 20
  n_mc_per_stratum: 6     # 120 MC per state-year  = 4 quarters x 5 strata x 6
  reps: 200        # audit years (Monte Carlo replicates; MC SE of 95% coverage ~ 1.5 pt)
  sim_reps: 25       # audit years scored for the simulation method (first 25 of reps)
  sim_iterations: 1000  # simulation iterations per audit year
  alpha: 0.05      # two-sided 95% intervals (PIIA reporting)
grid:   # one scenario per state; true eligibility rates 2.00%..4.00%
  name: "state_{state_id}"
  vars:
    state_id: [1, 2, 3, 4, 5, 6, 7, 8, 9]
