# PERM - estimation: draw state audits (systematic selection within strata,
# Neyman allocation) from the errors/ population and estimate each state's
# gross, eligibility and claims improper payments with each method
# (expansion, ratio, regression, and the audit-finding bootstrap
# simulation). national.yaml then pools the 9 states.
program: perm_estimation   # also the seed label for sampling and simulation
seed: 20261016
output_dir: results
steps:
  - sql: perm/estimation/sql/01_frame.sql        # estimands + Neyman allocation
  - sql: shared/sql/sample_systematic.sql                   # audit years (Monte Carlo replicates)
  - sql: perm/estimation/sql/10_expansion.sql
  - sql: perm/estimation/sql/20_ratio.sql
  - sql: perm/estimation/sql/30_regression.sql   # regression inputs: predictors for every population unit
  - {python: shared/ipsim/regression.py, run: run}   # regression: fit within strata, predict, residual interval
  - sql: perm/estimation/sql/40_simulation_inputs.sql   # audit findings + population rows
  - python: perm/estimation/simulation.py # bootstrap simulation: payments rerun 1,000x (numpy)
  - sql: perm/estimation/sql/90_score.sql
exports:
  - {table: estimates, order_by: "domain, method, interval, rep"}
  - {table: sim_draws, order_by: "domain, rep, iter"}   # iteration results, for pooling the states
json:
  - {table: metrics, order_by: "domain, method, interval", file: metrics.json}
  - {table: frame_totals, order_by: domain, file: truth.json}
defaults:
  population_dir: perm/errors/output/state_elig_grid
  components: [gross, eligibility, claims]   # PERM errors are all overpayments: gross = over = net, under = 0
  audit_size: 520  # payments per state-year, Neyman allocation over 10 strata (payment type x quintile)
  reps: 25         # audit years (Monte Carlo replicates)
  sim_reps: 25     # audit years run through the bootstrap simulation (all of them)
  sim_iterations: 1000  # simulation iterations per audit year
  sim_rates: parametric # parametric (reported): counts redrawn each iteration, f~ Binomial(n, f/n) then g~ Binomial(f~, g/f) | fixed (comparison; results_fixed/)
  sim_export_draws: true
  reg_predictors: [x, month, bene_n_pay, bene_paid]   # regression: basic beneficiary variables + amount paid
  reg_min_errors: 10   # regression: intercept-only in a model stratum with fewer audited errors
  alpha: 0.05      # two-sided 95% intervals (PIIA reporting)
grid:   # one scenario per state; true eligibility rates 2.00%..4.00%
  name: "state_{state_id}"
  vars:
    state_id: [1, 2, 3, 4, 5, 6, 7, 8, 9]
