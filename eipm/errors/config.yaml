# EIPM - errors: build error-free FFE APTC applications, then apply fake
# APTC errors (overpayments only: technically improper and monetary). Scaled: 1 synthetic application = 100 real applications.
program: eipm   # also the seed label: changing it changes every random draw
seed: 20261016
output_dir: output
steps:
  - sql: eipm/errors/sql/01_population.sql     # population (error-free APTC)
  - sql: eipm/errors/sql/02_apply_errors.sql   # fake errors
  - sql: eipm/errors/sql/03_truth.sql          # truth
  - sql: eipm/errors/sql/04_checks.sql         # checks
exports:
  - {table: population, order_by: unit_id}
json:
  - {table: checks, order_by: metric, file: checks.json}
truth: true
defaults:
  n_households: 150000
  w_pop: 100.0
  target_rate: 0.0089          # FY 2025 EIPM gross rate (0.89%, $657.46M)
  technical_share: 0.48        # FY 2025: technically improper 0.43 of 0.89 points; the rest monetary
  size_beta: 0.0             # technical and monetary error probability x (APTC / mean APTC)^size_beta, capped
  #                            # so an application's total error probability <= 0.95; p_t and p_m recalibrated
  #                            # with the per-application probabilities so the targets still hold (02_apply_errors).
  #                            # Default 0 (errors independent of APTC; the committed population). Not listed as a
  #                            # the base population (size_beta = 0) is byte-identical to the published one; set with --set size_beta=0.5.
  fpl_base: 15060.0            # 2024 HHS poverty guideline (used for PY 2025)
  fpl_per_person: 5380.0
  benchmark_base: 330.0        # monthly SLCSP at age 21 (illustrative)
  applicable_schedule:         # enhanced ARPA/IRA schedule, PY 2021-2025
    - {lo: 100, hi: 150, p_lo: 0.00, p_hi: 0.00}
    - {lo: 150, hi: 200, p_lo: 0.00, p_hi: 0.02}
    - {lo: 200, hi: 250, p_lo: 0.02, p_hi: 0.04}
    - {lo: 250, hi: 300, p_lo: 0.04, p_hi: 0.06}
    - {lo: 300, hi: 400, p_lo: 0.06, p_hi: 0.085}
    - {lo: 400, hi: 601, p_lo: 0.085, p_hi: 0.085}
scenarios:
  - name: base
design:
  unit: FFE application (household receiving APTC)
  strata: five equal-count quintiles of annual APTC paid (P1..P5)   # EIPM strata are NOT public; illustrative
  allocation: Neyman over 2,000 applications (estimation/config.yaml)
  selection: stratified_srs_without_replacement
  estimand: gross improper payment rate = sum y / sum x (all errors are overpayments)
