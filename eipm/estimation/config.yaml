# EIPM - estimation: draw production-design samples from the errors/
# population and estimate the gross APTC improper payment rate with each
# method (expansion, ratio, regression, simulation).
program: eipm_estimation   # also the seed label for sampling and simulation
seed: 20261016
output_dir: results
steps:
  - sql: eipm/estimation/sql/01_frame.sql        # estimand + design
  - sql: shared/sql/sample_srs.sql                          # audit years (Monte Carlo replicates)
  - sql: eipm/estimation/sql/10_expansion.sql
  - sql: eipm/estimation/sql/20_ratio.sql
  - sql: eipm/estimation/sql/30_regression.sql
  - sql: eipm/estimation/sql/40_simulation_inputs.sql   # audit findings + population rows
  - python: eipm/estimation/simulation.py      # simulation: payment function rerun 1,000x (numpy)
  - sql: eipm/estimation/sql/90_score.sql
exports:
  - {table: estimates, order_by: "domain, method, interval, rep"}
json:
  - {table: metrics, order_by: "domain, method, interval", file: metrics.json}
  - {table: frame_totals, order_by: domain, file: truth.json}
defaults:
  population_dir: eipm/errors/output/base
  allocation:      # EIPM strata are not public; illustrative, ~2,000 total
    - {stratum: A_lt150, n_h: 500}
    - {stratum: B_150_250, n_h: 500}
    - {stratum: C_250_400, n_h: 500}
    - {stratum: D_ge400, n_h: 500}
  reps: 200        # audit years (Monte Carlo replicates; MC SE of 95% coverage ~ 1.5 pt)
  sim_reps: 100       # audit years scored for the simulation method (first 100 of reps)
  sim_iterations: 1000  # simulation iterations per audit year
  alpha: 0.05      # two-sided 95% intervals (PIIA reporting)
scenarios:
  - name: base
